name: LocSim
options:
  bundleIdPrefix: com.rockykln
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.4"
packages:
  LocSimCore:
    path: Packages/LocSimCore
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "5"
targets:
  LocSim:
    type: application
    platform: iOS
    sources:
      - LocSim
      - LiveActivity
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
      # Icon Composer file: iOS 26 draws it with Liquid Glass. Older iOS versions use the
      # PNGs of the same name in the asset catalog.
      - path: design/icon/AppIcon.icon
        buildPhase: resources
    dependencies:
      - framework: Frameworks/IDevice.xcframework
        embed: false
      - target: LocSimTunnel
      - target: LocSimWidgets
      - package: LocSimCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rockykln.locsim
        PRODUCT_NAME: LocSim
        # Code shared with the widget extension that only runs in the app.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LOCSIM_APP
        # Siri AI (ToolIntent) exists from the iOS 27.3 SDK on. A build with an older SDK, such as
        # the current release Xcode, contains none of it, so it can be uploaded as usual.
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.3*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.4*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.5*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.6*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.7*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.8*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.9*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos28*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos29*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27.3*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27.4*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27.5*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27.6*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27.7*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27.8*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27.9*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator28*]": $(inherited) LOCSIM_APP SIRI_AI
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator29*]": $(inherited) LOCSIM_APP SIRI_AI
        # Mirrors Info.plist so Xcode's Identity section shows the values.
        INFOPLIST_KEY_CFBundleDisplayName: LocSim
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_FILE: LocSim/Info.plist
        CODE_SIGN_ENTITLEMENTS: LocSim/LocSim.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: YES
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Automatic
  LocSimTunnel:
    type: app-extension
    platform: iOS
    sources:
      - LocSimTunnel
    dependencies:
      - package: LocSimCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rockykln.locsim.tunnel
        PRODUCT_NAME: LocSimTunnel
        INFOPLIST_KEY_CFBundleDisplayName: LocSim
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_FILE: LocSimTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: LocSimTunnel/LocSimTunnel.entitlements
        DEAD_CODE_STRIPPING: YES
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Automatic
  LocSimWidgets:
    type: app-extension
    platform: iOS
    sources:
      - LocSimWidgets
      - LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rockykln.locsim.widgets
        PRODUCT_NAME: LocSimWidgets
        INFOPLIST_KEY_CFBundleDisplayName: LocSim
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_FILE: LocSimWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  LocSim:
    build:
      targets:
        LocSim: all
      preActions:
        - name: Stamp commit
          settingsTarget: LocSim
          script: |
            cd "$SRCROOT" || exit 0
            hash=$(git rev-parse --short=7 HEAD 2>/dev/null) || exit 0
            git diff --quiet HEAD 2>/dev/null || hash="$hash-dirty"
            echo "LOCSIM_COMMIT = $hash" > Config/Commit.xcconfig
    run:
      config: Debug
      # MapKit drops frames during transitions; Metal API validation turns that into a crash.
      enableGPUValidationMode: false
    profile:
      config: Release
    archive:
      config: Release
