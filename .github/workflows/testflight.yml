name: testflight

# Manual only: builds are usually uploaded from Xcode, and tags mark every build.
# Start it under Actions > testflight > Run workflow with a v* tag selected.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One run per tag; a second tag must not cancel one that waits for approval.
concurrency: testflight-${{ github.ref }}

env:
  IDEVICE_VERSION: v0.1.68
  IDEVICE_SHA256: c9eccdd1942de756d746a2569d93302774ab0eff1cff314ec8118f768b3d8dc7

jobs:
  # Checked before the approval is requested, so a mistyped tag fails right away.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' project.yml)
          build=$(sed -n 's/^ *CURRENT_PROJECT_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' project.yml)
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "v$version-$build" ]; then
            echo "::error::ref $GITHUB_REF_NAME does not match project.yml (expected tag v$version-$build)"
            exit 1
          fi
          echo "Version $version, build $build"

  upload:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 30
    # Secrets live in this environment; it requires approval and only allows v* tags.
    environment: testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          for name in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID TEAM_ID; do
            [ -n "${!name}" ] || { echo "::error::secret $name is missing in the testflight environment"; exit 1; }
          done

      # The newest Xcode 26 release on the image, so an image update does not break the build.
      # Betas and release candidates are skipped: sort -V puts Xcode_26.1_beta after Xcode_26.1.
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1 || true)
          [ -n "$xcode" ] || { echo "::error::no Xcode 26 release found in /Applications"; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Fetch IDevice.xcframework
        run: |
          curl -fsSL -o idevice.zip \
            "https://github.com/jkcoxson/idevice/releases/download/$IDEVICE_VERSION/idevice-xcframework-$IDEVICE_VERSION.zip"
          echo "$IDEVICE_SHA256  idevice.zip" | shasum -a 256 -c -
          unzip -q idevice.zip -d idevice
          mkdir -p Frameworks
          mv idevice/swift/IDevice.xcframework Frameworks/

      - name: Generate project
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -project LocSim.xcodeproj -scheme LocSim -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LocSim.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            -quiet archive

      - name: Upload to TestFlight
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LocSim.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -quiet

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
