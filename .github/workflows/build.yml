name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  IDEVICE_VERSION: v0.1.68
  IDEVICE_SHA256: c9eccdd1942de756d746a2569d93302774ab0eff1cff314ec8118f768b3d8dc7

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The setup scripts are not built anywhere else, so a syntax error would only show up on a user's computer.
      - name: Check setup scripts
        run: |
          for script in tools/*.sh; do bash -n "$script"; done
          pwsh -NoProfile -Command '
            $tokens = $null; $errors = $null
            $path = Join-Path $PWD "tools/make-pairing.ps1"
            $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors) {
              $errors | ForEach-Object { Write-Host "::error file=tools/make-pairing.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
              exit 1
            }'

      - name: Unit tests
        run: swift test --package-path Packages/LocSimCore

  build:
    needs: test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The newest Xcode 26 release on the image, so an image update does not break the build.
      # Betas and release candidates are skipped: sort -V puts Xcode_26.1_beta after Xcode_26.1.
      # Images often install the iOS platform only for their default Xcode; without it the
      # step falls back to that one.
      - name: Select Xcode
        run: |
          default=$(xcode-select -p)
          # grep without -q reads all of the output, so pipefail does not see a SIGPIPE.
          has_ios() { xcodebuild -showsdks 2>/dev/null | grep iphoneos > /dev/null; }
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1 || true)
          if [ -z "$xcode" ]; then
            echo "::warning::no Xcode_26 release found in /Applications, using the default $default"
          else
            sudo xcode-select -s "$xcode"
            if ! has_ios; then
              echo "::warning::$xcode lists no iOS SDK, falling back to the default $default"
              sudo xcode-select -s "$default"
            fi
          fi
          xcodebuild -version | grep -E '^Xcode 26' > /dev/null || { echo "::error::Xcode 26 is required, found: $(xcodebuild -version | head -1)"; exit 1; }
          has_ios || { echo "::error::the selected Xcode lists no iOS SDK (xcodebuild -showsdks)"; exit 1; }
          xcodebuild -version

      - name: Fetch IDevice.xcframework
        run: |
          curl -fsSL -o idevice.zip \
            "https://github.com/jkcoxson/idevice/releases/download/$IDEVICE_VERSION/idevice-xcframework-$IDEVICE_VERSION.zip"
          echo "$IDEVICE_SHA256  idevice.zip" | shasum -a 256 -c -
          unzip -q idevice.zip -d idevice
          mkdir -p Frameworks
          mv idevice/swift/IDevice.xcframework Frameworks/

      - name: Generate project
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      - name: Build
        run: |
          # Explicit, although shell: bash sets it too: without it a failed build would pass through tee.
          set -o pipefail
          xcodebuild -project LocSim.xcodeproj -scheme LocSim -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log > /dev/null

      - name: Warnings
        run: |
          grep -E "warning: .*LocSim" build.log | sort -u || true
          grep -E "^\*\* BUILD" build.log || true

      - name: Check bundle
        run: |
          app=build/Build/Products/Release-iphoneos/LocSim.app
          appex="$app/PlugIns/LocSimTunnel.appex"
          test -d "$appex"
          point=$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$appex/Info.plist")
          test "$point" = "com.apple.networkextension.packet-tunnel"
          widgets="$app/PlugIns/LocSimWidgets.appex"
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$widgets/Info.plist")" = "com.apple.widgetkit-extension"
          test -f "$app/PrivacyInfo.xcprivacy" && test -f "$appex/PrivacyInfo.xcprivacy"
          for lang in de fr es it; do
            test -f "$app/$lang.lproj/Localizable.strings" || { echo "missing $lang.lproj/Localizable.strings"; exit 1; }
          done

      - name: Build log
        if: failure()
        run: |
          grep -E "error:|ld: |Undefined symbols" -A3 build.log | head -100 || true
