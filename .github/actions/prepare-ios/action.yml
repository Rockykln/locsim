name: Prepare iOS build
description: Selects Xcode, fetches IDevice.xcframework and generates the project. Shared by the build and testflight workflows, so both always build with the same versions.

inputs:
  token:
    description: Token for release downloads through the API
    default: ${{ github.token }}

runs:
  using: composite
  steps:
  # The newest Xcode 27 release on the image, so an image update does not break the build.
  # Betas and release candidates are skipped: sort -V puts Xcode_27.1_beta after Xcode_27.1.
  # Images often install the iOS platform only for their default Xcode; without it the
  # step falls back to that one.
  - name: Select Xcode
    shell: bash
    run: |
      default=$(xcode-select -p)
      # grep without -q reads all of the output, so pipefail does not see a SIGPIPE.
      has_ios() { xcodebuild -showsdks 2>/dev/null | grep iphoneos > /dev/null; }
      xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1 || true)
      if [ -z "$xcode" ]; then
        echo "::warning::no Xcode_27 release found in /Applications, using the default $default"
      else
        sudo xcode-select -s "$xcode"
        if ! has_ios; then
          echo "::warning::$xcode lists no iOS SDK, falling back to the default $default"
          sudo xcode-select -s "$default"
        fi
      fi
      version=$(xcodebuild -version | awk '/^Xcode/ { print $2 }')
      major=${version%%.*}
      minor=$(echo "$version" | cut -d. -f2)
      [ "$major" -gt 27 ] || { [ "$major" -eq 27 ] && [ "${minor:-0}" -ge 1 ]; } \
        || { echo "::error::Xcode 27.1 or later is required, found: $version"; exit 1; }
      has_ios || { echo "::error::the selected Xcode lists no iOS SDK (xcodebuild -showsdks)"; exit 1; }
      xcodebuild -version

  # Signed in through the API: anonymous release downloads time out when GitHub is busy.
  - name: Fetch IDevice.xcframework
    env:
      GH_TOKEN: ${{ inputs.token }}
      IDEVICE_VERSION: v0.1.68
      IDEVICE_SHA256: c9eccdd1942de756d746a2569d93302774ab0eff1cff314ec8118f768b3d8dc7
    shell: bash
    run: |
      for try in 1 2 3 4 5; do
        gh release download "$IDEVICE_VERSION" -R jkcoxson/idevice --clobber \
          -p "idevice-xcframework-$IDEVICE_VERSION.zip" -O idevice.zip && break
        [ "$try" -lt 5 ] || exit 1
        sleep 10
      done
      echo "$IDEVICE_SHA256  idevice.zip" | shasum -a 256 -c -
      unzip -q idevice.zip -d idevice
      mkdir -p Frameworks
      mv idevice/swift/IDevice.xcframework Frameworks/

  - name: Generate project
    env:
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      GH_TOKEN: ${{ inputs.token }}
    shell: bash
    run: |
      for try in 1 2 3 4 5; do
        gh release download "$XCODEGEN_VERSION" -R yonaskolb/XcodeGen --clobber -p xcodegen.zip -O xcodegen.zip && break
        [ "$try" -lt 5 ] || exit 1
        sleep 10
      done
      echo "$XCODEGEN_SHA256  xcodegen.zip" | shasum -a 256 -c -
      unzip -q xcodegen.zip -d "$RUNNER_TEMP"
      "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
